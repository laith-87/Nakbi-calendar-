<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقويم النقباوي</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calendar-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .header {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .date-display {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
        }
        .day-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .date-value {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .gregorian-date {
            font-size: 1rem;
            color: #d1d8e0;
            margin-top: 8px;
        }
        .footer-note {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="calendar-card">
    <h2 class="header">التقويم النقباوي</h2>
    
    <div class="date-display">
        <div class="day-name" id="dayName">--</div>
        <div class="date-value" id="nakbiDate">--</div>
        <div class="gregorian-date" id="gregDate">--</div>
    </div>

    <div class="footer-note">يتحدد التاريخ تلقائياً حسب التاريخ اليومي الحالي</div>
</div>

<script>
    function updateCalendar() {
        const now = new Date();

        // أسماء الأيام بالعربية
        const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const dayName = days[now.getDay()];

        // تاريخ اليوم الميلادي
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const day = now.getDate();

        // تحويل أرقام التاريخ لسنوات/أرقام نكباوية (تلقائية حسب التاريخ اليومي)
        // يمكنك تعديل المعادلة أدناه لحساب التاريخ النقباوي المناسب بدقة
        const nakbiYear = String(year).slice(-2); 
        const nakbiMonth = month;
        const nakbiDay = day;

        // عرض التاريخ النقباوي
        document.getElementById('dayName').innerText = dayName;
        document.getElementById('nakbiDate').innerText = `${nakbiYear}/${nakbiMonth}/${nakbiDay}ن`;
        
        // عرض التاريخ الميلادي المقابل
        document.getElementById('gregDate').innerText = `الموافق: ${day}/${month}/${year} م`;
    }

    // تشغيل الدالة فور فتح الصفحة
    updateCalendar();
</script>

</body>
</html>
